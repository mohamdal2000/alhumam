[build]
  publish = "."
  command = "npm run build"

# Forms configuration (for serverless form handling without PHP)
[build.environment]
  NODE_VERSION = "20"

# Redirect rules
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Cache control for assets
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
